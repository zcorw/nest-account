name: Account package verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: account_test
          POSTGRES_PASSWORD: isolated_ci_password
          POSTGRES_DB: account_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U account_test" --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm test
        env:
          TEST_DATABASE_URL: postgresql://account_test:isolated_ci_password@127.0.0.1:5432/account_test
      - name: Verify locked consumer packages
        run: |
          npm --prefix tests/consumer ci
          npm --prefix tests/consumer test
      - name: Verify freshly built tarballs
        run: |
          consumer_dir="$RUNNER_TEMP/account-consumer"
          mkdir -p artifacts "$consumer_dir/vendor"
          npm run pack:all
          cp artifacts/*.tgz "$consumer_dir/vendor/"
          cp tests/consumer/{package.json,tsconfig.json,verify-types.ts,verify.mjs} "$consumer_dir/"
          npm --prefix "$consumer_dir" install
          npm --prefix "$consumer_dir" test
